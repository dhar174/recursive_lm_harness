[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recursive-lm"
version = "0.1.0"
description = "Harness that grants RLM superpowers to any LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recursive_lm"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
